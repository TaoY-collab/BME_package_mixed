seed: 42
deterministic: false

data:
  data_root: data
  all_csv: all_cases.csv
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  auto_split: true
  split_ratios: [0.8, 0.1, 0.1]
  split_dir: outputs/splits
  sample_pos_neg_ratio: 3.0
  input_format: image_label
  cache_dir: outputs/persistent_cache
  roi_size: [96, 96, 96]
  target_spacing: [1.0, 1.0, 1.0]
  intensity_mode: ct
  ct_window: [-1000, 400]
  profile_ratios: [1, 1, 1, 0.5, 0.5]
  samples_per_volume: 1
  train_repeat_factor: 1
  small_cc_voxels: 128
  large_cc_voxels: 4096
  overwrite_aux: false
  num_workers: 2
  pin_memory: false
  prefetch_factor: 1

model:
  name: hybrid_swin_sdf_core
  num_classes: 1
  img_size: [96, 96, 96]
  in_channels: 1
  ct_in_channels: 1
  swin_feature_channels: 16
  two_d_feature_channels: 16
  two_d_mode: z_axis_adjacent_triplet
  neighbor_radius: 1
  two_d_slice_chunk_size: 8
  fusion_channels: 32
  feature_size: 48
  use_checkpoint: true
  use_sdf_branch: true

loss:
  dice_weight: 1.0
  tversky_weight: 0.4
  boundary_start_epoch: 40
  boundary_end_epoch: 120
  boundary_max_weight: 0.02
  sdf_start_epoch: 20
  sdf_end_epoch: 80
  sdf_max_weight: 0.1
  tversky_alpha: 0.6
  tversky_beta: 0.4
  boundary_voxel_boost: 5.0
  dist_sigma: 0.2

train:
  epochs: 300
  batch_size: 1
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.00001
  scheduler: cosine
  amp: true
  cuda_memory_limit_gb: 20.0
  host_memory_limit_gb: 48.0
  grad_accum_steps: 4
  grad_clip_norm: 12.0
  drop_last: false

eval:
  threshold: 0.5
  val_sw_batch_size: 1
  overlap: 0.5
  spacing: [1.0, 1.0, 1.0]
  min_voxels: 16
  min_volume_mm3: null
  keep_largest: false

output:
  output_dir: outputs
