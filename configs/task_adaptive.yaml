seed: 42
deterministic: false

data:
  data_root: /home/lembert/Desktop/BME-4/BME-WYZ/data_processed/LIDC-IDRI
  train_csv: train.csv
  val_csv: val.csv
  test_csv: test.csv
  auto_split: true
  split_ratios: [0.8, 0.1, 0.1]
  split_dir: outputs/splits
  sample_pos_neg_ratio: 3.0
  input_format: auto
  cache_dir: outputs/persistent_cache
  roi_size: [96, 96, 96]
  target_spacing: [1.0, 1.0, 1.0]
  intensity_mode: ct
  ct_window: [-1000, 400]
  profile_ratios: [1, 1, 1, 0.5, 0.5]
  samples_per_volume: 8
  small_cc_voxels: 128
  large_cc_voxels: 4096
  overwrite_aux: false
  use_d2: true
  d2_percentile: 99.0
  num_workers: 4

model:
  name: hybrid_swin_sdf_core
  num_classes: 1
  img_size: [96, 96, 96]
  in_channels: 2
  ct_in_channels: 1
  use_d2_aux_branch: true
  d2_in_channels: 1
  d2_aux_channels: 16
  swin_feature_channels: 16
  two_d_feature_channels: 16
  fusion_channels: 32
  feature_size: 24
  use_checkpoint: true

loss:
  warmup_epochs: 15
  stage2_start_epoch: 80
  dice_weight_start: 1.0
  dice_weight_end: 0.35
  ce_weight_start: 1.0
  ce_weight_end: 0.25
  tversky_weight_start: 0.0
  tversky_weight_end: 1.2
  boundary_weight_start: 0.0
  boundary_weight_end: 0.8
  sdf_weight_start: 0.0
  sdf_weight_end: 0.3
  core_weight_start: 0.0
  core_weight_end: 0.3
  tversky_alpha: 0.3
  tversky_beta: 0.7
  boundary_voxel_boost: 5.0
  dist_sigma: 0.2
  stage2_weight_power: 1.0
  max_stage2_weight: 8.0

train:
  epochs: 300
  batch_size: 1
  lr: 0.0001
  min_lr: 0.000001
  weight_decay: 0.00001
  scheduler: cosine
  amp: true
  grad_accum_steps: 4
  grad_clip_norm: 12.0
  drop_last: false

eval:
  threshold: 0.5
  spacing: [1.0, 1.0, 1.0]
  min_voxels: 16
  min_volume_mm3: null
  keep_largest: false

output:
  output_dir: outputs
